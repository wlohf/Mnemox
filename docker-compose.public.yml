# Public deployment for mnemox.wlohf.com. The Caddy reverse proxy and this
# compose project share the pre-existing external `web` Docker network.
services:
  backend:
    environment:
      CORS_ORIGINS: '["https://mnemox.wlohf.com"]'
      # Requests reach the backend through Caddy and the frontend Nginx
      # proxy. The backend itself has no public port, so two forwarded hops
      # are the trusted public deployment boundary.
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_HOPS: "2"

  frontend:
    networks:
      default:
      web:
        aliases:
          - mnemox-frontend

networks:
  web:
    external: true
