services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_assistant
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/study_assistant
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:-}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CORS_ORIGINS: '["http://localhost"]'
      DEBUG: "false"
      ENVIRONMENT: "production"
      MATERIAL_UPLOAD_MAX_MB: ${MATERIAL_UPLOAD_MAX_MB:-200}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-20}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      COACH_INTERVENTION_EXPERIMENT_ENABLED: ${COACH_INTERVENTION_EXPERIMENT_ENABLED:-false}
      COACH_INTERVENTION_EXPERIMENT_ID: ${COACH_INTERVENTION_EXPERIMENT_ID:-coach_intervention_aa_v1}
      COACH_INTERVENTION_EXPERIMENT_SPLIT_PERCENT: ${COACH_INTERVENTION_EXPERIMENT_SPLIT_PERCENT:-50}
      KNOWLEDGE_V2_ENABLED: ${KNOWLEDGE_V2_ENABLED:-false}
      KNOWLEDGE_LLM_EXTRACTION_ENABLED: ${KNOWLEDGE_LLM_EXTRACTION_ENABLED:-false}
      KNOWLEDGE_EMBEDDING_ENABLED: ${KNOWLEDGE_EMBEDDING_ENABLED:-false}
      ASSOCIATION_V2_ENABLED: ${ASSOCIATION_V2_ENABLED:-false}
      KNOWLEDGE_PATH_ENABLED: ${KNOWLEDGE_PATH_ENABLED:-false}
      ASSOCIATION_MULTIHOP_EXPLANATION_ENABLED: ${ASSOCIATION_MULTIHOP_EXPLANATION_ENABLED:-false}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-sql}
      NEO4J_GRAPH_ROLLOUT_PERCENT: ${NEO4J_GRAPH_ROLLOUT_PERCENT:-100}
      NEO4J_GRAPH_ROLLOUT_USER_IDS: ${NEO4J_GRAPH_ROLLOUT_USER_IDS:-}
      NEO4J_GRAPH_ENABLED: ${NEO4J_GRAPH_ENABLED:-false}
      NEO4J_GRAPH_SHADOW: ${NEO4J_GRAPH_SHADOW:-false}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      # Local-only Stage 6 fallback. Override this before any non-local Shadow use.
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mnemox-shadow-local}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPHITI_ENABLED: ${GRAPHITI_ENABLED:-false}
      GRAPHITI_SHADOW: ${GRAPHITI_SHADOW:-false}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      OUTBOX_WORKER_POLL_INTERVAL_SECONDS: ${OUTBOX_WORKER_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
      OUTBOX_WORKER_MAX_ATTEMPTS: ${OUTBOX_WORKER_MAX_ATTEMPTS:-5}
      OUTBOX_WORKER_RETRY_POLICY_VERSION: ${OUTBOX_WORKER_RETRY_POLICY_VERSION:-1}
      OUTBOX_WORKER_ID: ${OUTBOX_WORKER_ID:-}
      OUTBOX_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${OUTBOX_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      OUTBOX_WORKER_HEARTBEAT_TTL_SECONDS: ${OUTBOX_WORKER_HEARTBEAT_TTL_SECONDS:-45}
      OUTBOX_ALERT_BACKLOG_COUNT_THRESHOLD: ${OUTBOX_ALERT_BACKLOG_COUNT_THRESHOLD:-100}
      OUTBOX_ALERT_BACKLOG_AGE_SECONDS: ${OUTBOX_ALERT_BACKLOG_AGE_SECONDS:-900}
      OUTBOX_ALERT_TERMINAL_FAILURE_THRESHOLD: ${OUTBOX_ALERT_TERMINAL_FAILURE_THRESHOLD:-1}
      OUTBOX_ALERT_STALE_PROCESSING_THRESHOLD: ${OUTBOX_ALERT_STALE_PROCESSING_THRESHOLD:-1}
      OUTBOX_OPS_TOKEN: ${OUTBOX_OPS_TOKEN:-}
      # The worker only evaluates users who explicitly enable proactive Coach.
      AGENT_RUNTIME_SCHEDULER_ENABLED: ${AGENT_RUNTIME_SCHEDULER_ENABLED:-true}
      AGENT_RUNTIME_POLL_INTERVAL_SECONDS: ${AGENT_RUNTIME_POLL_INTERVAL_SECONDS:-300}
      AGENT_RUNTIME_BATCH_SIZE: ${AGENT_RUNTIME_BATCH_SIZE:-50}
      AGENT_RUNTIME_USER_INTERVAL_SECONDS: ${AGENT_RUNTIME_USER_INTERVAL_SECONDS:-21600}
      AGENT_RUNTIME_RETRY_INTERVAL_SECONDS: ${AGENT_RUNTIME_RETRY_INTERVAL_SECONDS:-900}
      AGENT_RUNTIME_USER_TIMEOUT_SECONDS: ${AGENT_RUNTIME_USER_TIMEOUT_SECONDS:-60}
      AGENT_KERNEL_LEASE_SECONDS: ${AGENT_KERNEL_LEASE_SECONDS:-120}
      AGENT_KERNEL_MAX_MODEL_CALLS: ${AGENT_KERNEL_MAX_MODEL_CALLS:-7}
      AGENT_KERNEL_MAX_ESTIMATED_TOKENS: ${AGENT_KERNEL_MAX_ESTIMATED_TOKENS:-32000}
      AGENT_KERNEL_DAILY_MODEL_CALLS_PER_USER: ${AGENT_KERNEL_DAILY_MODEL_CALLS_PER_USER:-30}
      AGENT_KERNEL_DAILY_ESTIMATED_TOKENS_PER_USER: ${AGENT_KERNEL_DAILY_ESTIMATED_TOKENS_PER_USER:-128000}
    volumes:
      - uploads:/app/data/uploads
      - chromadb:/app/data/chromadb

  frontend:
    build: ./frontend
    depends_on:
      - backend

  # Optional graph server profile. The default deployment does not start Neo4j.
  # `graph-shadow` remains as a compatibility alias for the Stage 6 workflow;
  # Stage 7 server testing should prefer `--profile graph`.
  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph", "graph-shadow"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mnemox-shadow-local}
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j_shadow_data:/data
    healthcheck:
      test: ["CMD-SHELL", "auth=$${NEO4J_AUTH}; cypher-shell -u \"$${auth%%/*}\" -p \"$${auth#*/}\" 'RETURN 1;' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  uploads:
  chromadb:
  neo4j_shadow_data:
