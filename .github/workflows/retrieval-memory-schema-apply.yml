name: Apply retrieval memory schema compatibility

on:
  push:
    branches:
      - agent/retrieval-router-closure
    paths:
      - scripts/apply_retrieval_memory_schema_compat.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retrieval-router-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_retrieval_memory_schema_compat.py
      - run: python -m py_compile backend/app/agents/chat_agent.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/agents/chat_agent.py
          git commit -m "Preserve legacy memory tool response fields"
          git push origin HEAD:agent/retrieval-router-closure
