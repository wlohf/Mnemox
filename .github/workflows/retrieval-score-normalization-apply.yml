name: Apply retrieval score normalization

on:
  push:
    branches:
      - agent/retrieval-router-closure
    paths:
      - scripts/apply_retrieval_score_normalization.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retrieval-router-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply score normalization patch
        run: python scripts/apply_retrieval_score_normalization.py
      - name: Validate syntax
        run: python -m py_compile backend/app/services/retrieval_router.py backend/tests/test_retrieval_router.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Normalize material retrieval scores at router boundary"
          git push origin HEAD:agent/retrieval-router-closure
