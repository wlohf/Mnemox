name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select comparison range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              empty_tree="$(git hash-object -t tree /dev/null)"
              range="$empty_tree..HEAD"
            else
              range="$before..HEAD"
            fi
          fi
          echo "DIFF_RANGE=$range" >> "$GITHUB_ENV"

      - name: Reject unresolved conflict markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "Unresolved merge-conflict markers found." >&2
            exit 1
          fi

      - name: Check changed-line whitespace
        run: git diff --check "$DIFF_RANGE"

      - name: Validate changed Markdown links
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import urllib.parse

          root = pathlib.Path.cwd()
          changed = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMR",
                  "-z",
                  os.environ["DIFF_RANGE"],
                  "--",
                  "*.md",
              ],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\0")

          inline_link = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          reference_link = re.compile(r"^\s*\[[^\]]+\]:\s*(\S+)", re.MULTILINE)
          broken = []

          for raw_name in changed:
              if not raw_name:
                  continue
              document = root / os.fsdecode(raw_name)
              if not document.is_file():
                  continue
              text = document.read_text(encoding="utf-8")
              targets = inline_link.findall(text) + reference_link.findall(text)
              for raw_target in targets:
                  target = raw_target.strip()
                  if target.startswith("<") and ">" in target:
                      target = target[1 : target.index(">")]
                  else:
                      target = target.split(maxsplit=1)[0]

                  parsed = urllib.parse.urlsplit(target)
                  if not parsed.path or parsed.scheme or target.startswith("//"):
                      continue

                  link_path = pathlib.Path(urllib.parse.unquote(parsed.path))
                  candidate = (
                      root / str(link_path).lstrip("/")
                      if link_path.is_absolute()
                      else document.parent / link_path
                  )
                  if not candidate.exists():
                      broken.append(f"{document.relative_to(root)} -> {target}")

          if broken:
              print("Broken local Markdown links:")
              print("\n".join(f"  {item}" for item in broken))
              raise SystemExit(1)

          print(f"Validated local links in {sum(bool(name) for name in changed)} changed Markdown file(s).")
          PY

      - name: Validate Alembic revision graph
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib

          versions = pathlib.Path("backend/alembic/versions")
          revisions = {}

          for migration in sorted(versions.glob("*.py")):
              values = {}
              for node in ast.parse(migration.read_text(encoding="utf-8")).body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              values[target.id] = ast.literal_eval(node.value)
                  elif isinstance(node, ast.AnnAssign):
                      target = node.target
                      if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                          values[target.id] = ast.literal_eval(node.value)

              if "revision" not in values or "down_revision" not in values:
                  raise SystemExit(f"Missing revision metadata: {migration}")
              revision = values["revision"]
              if revision in revisions:
                  raise SystemExit(f"Duplicate Alembic revision: {revision}")
              revisions[revision] = (values["down_revision"], migration)

          parents = set()
          for revision, (down_revision, migration) in revisions.items():
              dependencies = (
                  down_revision
                  if isinstance(down_revision, (tuple, list, set))
                  else (down_revision,)
              )
              for parent in dependencies:
                  if parent is None:
                      continue
                  if parent not in revisions:
                      raise SystemExit(
                          f"Alembic revision {revision} in {migration} has missing parent {parent}"
                      )
                  parents.add(parent)

          heads = sorted(set(revisions) - parents)
          if len(heads) != 1:
              raise SystemExit(f"Expected one Alembic head, found: {heads}")

          print(f"Validated {len(revisions)} Alembic revision(s); head: {heads[0]}")
          PY

  backend:
    name: Backend / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

  desktop-windows:
    name: Desktop / Windows / Node 20
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run desktop tests
        run: npm test
