name: Apply retrieval contract fixes

on:
  push:
    branches:
      - agent/retrieval-router-closure
    paths:
      - scripts/apply_retrieval_contract_fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retrieval-router-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/apply_retrieval_contract_fixes.py
      - run: |
          python -m py_compile \
            backend/app/services/retrieval_router.py \
            backend/app/services/note_context_service.py \
            backend/app/agents/chat_agent.py \
            backend/tests/test_retrieval_router.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "Restore retrieval adapter compatibility contracts"
          git push origin HEAD:agent/retrieval-router-closure
