name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select comparison range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              empty_tree="$(git hash-object -t tree /dev/null)"
              range="$empty_tree..HEAD"
            else
              range="$before..HEAD"
            fi
          fi
          echo "DIFF_RANGE=$range" >> "$GITHUB_ENV"

      - name: Reject unresolved conflict markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "Unresolved merge-conflict markers found." >&2
            exit 1
          fi

      - name: Check changed-line whitespace
        run: git diff --check "$DIFF_RANGE"

      - name: Validate changed Markdown links
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import urllib.parse

          root = pathlib.Path.cwd()
          changed = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMR",
                  "-z",
                  os.environ["DIFF_RANGE"],
                  "--",
                  "*.md",
              ],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\0")

          inline_link = re.compile(r"!?\[[^\]]*\]\(([^)]+)\)")
          reference_link = re.compile(r"^\s*\[[^\]]+\]:\s*(\S+)", re.MULTILINE)
          broken = []

          for raw_name in changed:
              if not raw_name:
                  continue
              document = root / os.fsdecode(raw_name)
              if not document.is_file():
                  continue
              text = document.read_text(encoding="utf-8")
              targets = inline_link.findall(text) + reference_link.findall(text)
              for raw_target in targets:
                  target = raw_target.strip()
                  if target.startswith("<") and ">" in target:
                      target = target[1 : target.index(">")]
                  else:
                      target = target.split(maxsplit=1)[0]

                  parsed = urllib.parse.urlsplit(target)
                  if not parsed.path or parsed.scheme or target.startswith("//"):
                      continue

                  link_path = pathlib.Path(urllib.parse.unquote(parsed.path))
                  candidate = (
                      root / str(link_path).lstrip("/")
                      if link_path.is_absolute()
                      else document.parent / link_path
                  )
                  if not candidate.exists():
                      broken.append(f"{document.relative_to(root)} -> {target}")

          if broken:
              print("Broken local Markdown links:")
              print("\n".join(f"  {item}" for item in broken))
              raise SystemExit(1)

          print(f"Validated local links in {sum(bool(name) for name in changed)} changed Markdown file(s).")
          PY

      - name: Validate Alembic revision graph
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib

          versions = pathlib.Path("backend/alembic/versions")
          revisions = {}

          for migration in sorted(versions.glob("*.py")):
              values = {}
              for node in ast.parse(migration.read_text(encoding="utf-8")).body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              values[target.id] = ast.literal_eval(node.value)
                  elif isinstance(node, ast.AnnAssign):
                      target = node.target
                      if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                          values[target.id] = ast.literal_eval(node.value)

              if "revision" not in values or "down_revision" not in values:
                  raise SystemExit(f"Missing revision metadata: {migration}")
              revision = values["revision"]
              if revision in revisions:
                  raise SystemExit(f"Duplicate Alembic revision: {revision}")
              revisions[revision] = (values["down_revision"], migration)

          parents = set()
          for revision, (down_revision, migration) in revisions.items():
              dependencies = (
                  down_revision
                  if isinstance(down_revision, (tuple, list, set))
                  else (down_revision,)
              )
              for parent in dependencies:
                  if parent is None:
                      continue
                  if parent not in revisions:
                      raise SystemExit(
                          f"Alembic revision {revision} in {migration} has missing parent {parent}"
                      )
                  parents.add(parent)

          heads = sorted(set(revisions) - parents)
          if len(heads) != 1:
              raise SystemExit(f"Expected one Alembic head, found: {heads}")

          print(f"Validated {len(revisions)} Alembic revision(s); head: {heads[0]}")
          PY

      - name: Validate application version consistency
        run: python3 scripts/release_preflight.py

  backend:
    name: Backend / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit Python production dependencies
        run: |
          python -m pip install pip-audit
          # ChromaDB has no fixed release for these server-side findings yet.
          # Mnemox uses PersistentClient only; see docs/security.md.
          python -m pip_audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

      - name: Run backend tests
        run: python -m pytest -q

      - name: Enforce deterministic retrieval quality baseline
        run: python evaluate_retrieval.py --backend hybrid --min-recall-at-5 0.75 --summary-only

  postgres-acceptance:
    name: PostgreSQL 16 / migration and multi-worker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mnemox_acceptance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mnemox_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/mnemox_acceptance
      POSTGRES_ACCEPTANCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/mnemox_acceptance
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Migrate fresh PostgreSQL database
        run: python run_migrations.py

      - name: Run PostgreSQL release gate
        run: python -m pytest -q tests/acceptance/test_postgres_release_gate.py

      - name: Rehearse historical upgrade and dump restore
        run: ../scripts/ci_postgres_upgrade_rehearsal.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_REHEARSAL_URL_PREFIX: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432

      - name: Reject schema drift
        run: python -m alembic check

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

  browser-acceptance:
    name: Browser / Chromium / critical paths
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/mnemox-vite.log" 2>&1 &
          vite_pid=$!
          cleanup() {
            kill "$vite_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/login >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:5173/login >/dev/null
          npm run test:e2e

      - name: Upload browser acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/output/playwright
            ${{ runner.temp }}/mnemox-vite.log

  desktop-windows:
    name: Desktop / Windows / Node 20 smoke
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Audit desktop production dependencies
        run: npm audit --omit=dev --audit-level=high
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Run desktop tests
        run: npm test

      - name: Validate Electron entry points
        run: |
          node --check src/main.js
          node --check src/preload.js
